name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies (pinned versions)
        run: npm install --no-audit --no-fund

      - name: Add Android platform
        run: npx cap add android

      - name: Apply app icons
        run: |
          cp -R android-res/. android/app/src/main/res/
          test -f android/app/src/main/res/drawable-nodpi/ic_launcher_fg.png
          grep -q ic_launcher_fg android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml

      - name: Sync web files
        run: npx cap sync android

      - name: Set version code (grows with every build)
        run: |
          sed -i -E "s/versionCode[[:space:]]*=?[[:space:]]*[0-9]+/versionCode ${{ github.run_number }}/" android/app/build.gradle
          grep -n "versionCode" android/app/build.gradle
          grep -q "versionCode ${{ github.run_number }}" android/app/build.gradle

      - name: Use the fixed test signing key
        run: |
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Show signature
        continue-on-error: true
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/apksigner verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: nivelyuvannya-tah-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
